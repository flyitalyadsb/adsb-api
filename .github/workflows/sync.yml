name: sync

# Keeps the repository in sync with the live API and site: the OpenAPI copy, and the
# generated parts of README.md and llms.txt (between <!-- sync:… --> markers).
# See scripts/sync.py for the sources and the safety checks.
#
# A change is committed straight to main by github-actions[bot]. If a page no longer
# parses, live sources disagree or an example would break, the run fails and nothing
# is committed. Pushes made with GITHUB_TOKEN don't start other workflows, so this job
# runs the same offline checks as CI itself before committing.

on:
  schedule:
    - cron: "41 4 * * *"  # daily; GitHub may start scheduled runs hours late, which is fine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Regenerate from the live API and site, with safety checks
        run: python3 scripts/sync.py --summary "$RUNNER_TEMP/summary.txt"

      - name: Only the generated files may change
        run: |
          unexpected=$(git status --porcelain | grep -v -E '^ M (openapi/openapi\.json|README\.md|llms\.txt)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::sync touched files it must not: $unexpected"
            exit 1
          fi

      - name: Same offline checks as CI
        run: sh scripts/checks.sh

      - name: Secret scan of the working tree
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact -v --no-banner --exit-code 1

      - name: Commit and push if anything changed
        run: |
          summary=$(cat "$RUNNER_TEMP/summary.txt")
          echo "### sync: $summary" >> "$GITHUB_STEP_SUMMARY"
          git add openapi/openapi.json README.md llms.txt
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "sync: $summary" -m "Generated by .github/workflows/sync.yml from the live API and site."
          git push origin HEAD:main
